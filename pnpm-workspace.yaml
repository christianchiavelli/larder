# Dependency build scripts are opt-in (pnpm 10+, `allowBuilds` map since 11).
#
# Both entries below ship prebuilt native binaries that their install script
# unpacks and places. Without the script the package resolves but has no binary
# to run, so the build fails at first use rather than at install. Every other
# dependency stays denied: a postinstall is arbitrary code execution at
# `pnpm install` time, and nothing else here has earned it.
allowBuilds:
  esbuild: true
  unrs-resolver: true

overrides:
  # Pin one TypeScript across the whole graph.
  #
  # TypeScript 7 is the native (Go) compiler, and typescript-eslint refuses to
  # load against it: its supported range is >=4.8.4 <6.1.0. A transitive
  # dependency of Nuxt pulls 7 in, and because pnpm isolates versions, the
  # ESLint parser resolved that copy instead of ours and failed the whole lint
  # run even after the direct dependency was downgraded.
  #
  # 6.0.3 is the newest release the linter supports. Beyond unblocking lint, two
  # compilers in one graph is worth avoiding on its own: the editor, vue-tsc and
  # ESLint would each be type-checking against different semantics.
  #
  # Revisit when typescript-eslint ships TS 7 support (issue #10940).
  typescript: 6.0.3
