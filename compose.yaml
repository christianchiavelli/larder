# Larder on one machine: `docker compose up --wait --build`, then http://localhost:3000.
name: larder

services:
  web:
    build: .
    image: larder:local
    # Node is not built to be PID 1: tini forwards signals and reaps children.
    init: true
    restart: unless-stopped
    environment:
      # Each page links its other language by a whole URL, so this must be the address a
      # reader is on. It follows the port below, or the links would point at 3000 anywhere else.
      NUXT_PUBLIC_I18N_BASE_URL: ${NUXT_PUBLIC_I18N_BASE_URL:-http://localhost:${LARDER_PORT:-3000}}
    ports:
      # Loopback only, so it is on this machine and not on the network it is plugged into.
      - '127.0.0.1:${LARDER_PORT:-3000}:3000'
