# Larder on one machine: `docker compose up --wait --build`, then
# http://localhost:3000.
#
# The app is a server, not a folder of files: its pages and its API routes read
# Open Food Facts as they are asked, so there is nothing here to serve statically.
name: larder

services:
  web:
    build: .
    image: larder:local
    # Node is not built to be PID 1: tini forwards signals and reaps children.
    init: true
    restart: unless-stopped
    environment:
      # The address the app is opened at. Each page links its other language by a
      # whole URL, so this has to be the one a reader is actually on (README).
      # Override it without editing this file: NUXT_PUBLIC_I18N_BASE_URL=... .
      NUXT_PUBLIC_I18N_BASE_URL: ${NUXT_PUBLIC_I18N_BASE_URL:-http://localhost:3000}
    ports:
      # Bound to the loopback address, so it is on this machine and not on the
      # network it is plugged into. LARDER_PORT moves it off a busy 3000.
      - '127.0.0.1:${LARDER_PORT:-3000}:3000'
