name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Once a week, against whatever the catalogue and the dependencies have become since, with
  # the end-to-end job's retries taken away. A test that only sometimes passes then has to
  # show up somewhere, and a red run is seen where a notice in a green run is not.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# A new push to the same branch makes the in-flight run irrelevant. Cancelling
# it frees the runner instead of paying for a result nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the code, and no checkout keeps the token in .git,
# where a later step or an uploaded artifact could pick it up.
permissions:
  contents: read

jobs:
  workflows:
    name: Workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Expressions, job graphs and every run script, through the shellcheck in the image.
      - name: Lint workflows
        run: >-
          docker run --rm --volume "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

      # Injection, excessive permissions, persisted credentials, and actions
      # pinned to a commit their repository does not have, which takes the token.
      - name: Audit workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.31.1 --format github .github/workflows

  # Lint, types and unit tests run as one job rather than three. They share an
  # install and a Nuxt prepare that together cost more than any of the checks,
  # so splitting them would triple the setup to parallelise the cheap part.
  verify:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Check types
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Browsers and their system libraries come from Playwright's image, so nothing here runs
    # apt. The tag must match `@playwright/test` exactly; `--ipc=host` is what Chromium needs.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    timeout-minutes: 20
    # A scheduled run asks for no retries, so a flaky test surfaces instead of hiding.
    env:
      E2E_RETRIES: ${{ github.event_name == 'schedule' && '0' || '2' }}
    # Only after the cheap checks pass. A type error would fail every browser
    # spec for the same reason, several minutes later and less legibly.
    needs: verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Production build, because the design-token regression these specs
      # guard against involves Tailwind's source scanning, which behaves
      # differently under the dev server.
      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  storybook:
    name: Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # After the cheap checks, for the same reason as the end-to-end job.
    needs: verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The headless shell alone: stories are rendered and audited, never watched.
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps --only-shell chromium

      # Builds the static Storybook, then renders every story in both themes:
      # it must render, its play function must pass and axe must find nothing.
      - name: Test stories
        run: pnpm run storybook:test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: storybook-report
          path: playwright-report/
          retention-days: 7

  vitals:
    name: Web Vitals
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # After the cheap checks, for the same reason as the end-to-end job.
    needs: verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Chrome itself, not the headless shell: it paints the way Chrome does.
      - name: Install Playwright
        run: pnpm exec playwright install --with-deps chromium

      # Fails when a page measures worse than its baseline; the table lands in the run's summary.
      - name: Build and measure
        run: pnpm run vitals

      # What `pnpm vitals:accept` takes as the next baseline.
      - name: Upload measurement
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-vitals
          path: vitals-report/
          retention-days: 90

  # The image is built and started here, not merely described. A Dockerfile that nothing runs
  # rots quietly: a dependency moves, the build stops working, and nobody finds out until
  # somebody needs the image — the day it matters most.
  #
  # It is started through compose, so compose.yaml is checked with it. `up --wait` returns
  # only once the healthcheck in the Dockerfile has said the app is serving, which is the one
  # claim about the image worth testing: that it comes up and answers.
  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # After the cheap checks, for the same reason as the end-to-end job.
    needs: verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Plain docker rather than a build action: the runner already has it, and an action
      # would be one more pin to keep current for a command that is not going to change.
      - name: Build the image
        run: docker compose build

      - name: Start it, and wait for the healthcheck to answer
        run: docker compose up --detach --wait

      - name: Ask it for the page a reader would open, and for its health
        run: |
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/
          curl --fail --silent --show-error --output /dev/null http://localhost:3000/api/health

      - name: Stop it
        if: always()
        run: docker compose down
